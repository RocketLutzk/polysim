name: Збір даних Polymarket

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: polysim
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Встановити залежності
        run: pip install -r requirements.txt

      - name: Один цикл (знімок цін, ставки, розрахунок)
        run: python -m polysim gh-cycle

      - name: Зберегти дані в репозиторій
        run: |
          git config user.name "polysim-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then echo "Змін немає"; exit 0; fi
          git commit -q -m "Дані $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            sleep 5
          done
          echo "Не вдалося зберегти дані" && exit 1

      - name: Не дати GitHub вимкнути розклад (раз на добу)
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%H)" = "03" ]; then
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/collect.yml/enable" \
              && echo "Розклад підтверджено" || echo "Не вдалося (не критично)"
          fi
